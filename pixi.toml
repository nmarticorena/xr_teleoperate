[workspace]
authors = ["nmarticorena <nicolas.marticorena.vidal@gmail.com>"]
channels = ["conda-forge", "nmarticorena"]
name = "xr_teleoperate"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
set_quest = {cmd = "openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout key.pem -out cert.pem"}
teleop_sim = {cmd = "python teleop_hand_and_arm.py --input-mode=controller --ee=inspire_dfx --img-server-ip 10.68.60.142  --arm=G1_23 --sim --record" , cwd = "teleop"}
teleop_real = {cmd = "python teleop_hand_and_arm.py --input-mode=hand --ee=inspire_ftp --img-server-ip 192.168.123.164  --arm=G1_29 --record" , cwd = "teleop"}
teleop_1d = {cmd = "python teleop_hand_and_arm.py --input-mode=controller --ee=dex1 --img-server-ip 10.68.60.142  --arm=G1_23 --sim --record" , cwd = "teleop"}

[system-requirements]
cuda = "12.6"

[dependencies]
cuda-version = "12.6.*"
python = "==3.10"
pytorch = {build = "cuda126*"}
pinocchio = ">=3.1.0"
numpy = "2.*"
aiohttp = "==3.10.5"
aiohttp-cors = ">=0.8.1,<0.9"
meshcat-python = ">=0.3.2,<0.4"
matplotlib = ">=3.10.8,<4"
rerun-sdk = "0.29.*"
ipython = ">=8.37.0,<9"
pdbpp = ">=0.12.0.post1,<0.13"
motion_tools = {version = ">=0.1.13,<0.2", channel = "nmarticorena"}
gdown = ">=5.2.1,<6"
inspire_hand_sdk = {channel = "nmarticorena"}
unitree_sdk2py = {channel = "nmarticorena"}

[pypi-dependencies]
teleimager = {path = "teleop/teleimager", editable = true}
televuer = {path = "teleop/televuer", editable = true}
vuer ={version =  "==0.0.60", extras = ["all"]}
params-proto = "==2.13.2"
sshkeyboard = ">=2.3.1, <3"
dex-retargeting = {path = "dex-retargeting", editable = true}
logging-mp = "<0.2.0"
